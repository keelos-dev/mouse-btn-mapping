<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G502 板载按键映射</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2025; --muted: #6b7280;
  --line: #e3e6ea; --accent: #2563eb; --accent-text: #fff; --warn: #b45309; --err: #dc2626; --ok: #15803d;
  --chip: #eef2ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --panel: #1d2026; --text: #e6e8eb; --muted: #9aa1ab;
    --line: #2d3139; --accent: #3b82f6; --accent-text: #fff; --warn: #f59e0b; --err: #f87171; --ok: #4ade80;
    --chip: #232a3b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Microsoft YaHei UI", "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
#dev { color: var(--muted); font-size: 13px; }
header .sp { flex: 1; }
main { padding: 16px 20px 24px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tab { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; background: transparent; color: var(--text); }
.tab.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.tab .cur { font-size: 11px; opacity: .8; margin-left: 4px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.name { white-space: nowrap; }
td.name small { color: var(--muted); display: block; font-size: 11px; }
select, button { font: inherit; color: var(--text); }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.keycfg { display: inline-flex; gap: 6px; align-items: center; margin-left: 8px; }
.keycfg label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; }
button.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#status { margin-top: 10px; font-size: 13px; min-height: 20px; white-space: pre-wrap; }
#status.err { color: var(--err); } #status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
aside h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
aside p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
pre { background: var(--chip); border-radius: 6px; padding: 10px; font: 12px/1.5 Consolas, monospace;
  white-space: pre-wrap; margin: 0 0 10px; user-select: text; }
.raw { font: 11px Consolas, monospace; color: var(--muted); margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>G502 板载按键映射</h1>
  <span id="dev">未连接</span>
  <span class="sp"></span>
  <button class="btn" id="bConnect">重新读取</button>
</header>
<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <table>
      <thead><tr><th style="width:150px">按键</th><th>功能</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="actions">
      <button class="btn primary" id="bWrite" disabled>写入鼠标</button>
      <button class="btn" id="bF1314" disabled>G7/G8 → F13/F14</button>
      <button class="btn" id="bUndo" disabled>放弃修改</button>
      <span class="sp" style="flex:1"></span>
      <button class="btn" id="bRestore" disabled>恢复原始备份</button>
      <button class="btn" id="bFactory" disabled>恢复出厂</button>
      <button class="btn" id="bDir">备份目录</button>
    </div>
    <div id="status"></div>
  </section>
  <aside class="panel">
    <h2>AutoHotkey v2 模板</h2>
    <p>按当前配置里映射的键自动生成，复制进 .ahk 再改动作。按住和松开会原样传给 AHK，按住类的操作也能用。</p>
    <pre id="ahk"></pre>
    <button class="btn" id="bCopy">复制</button>
    <h2 style="margin-top:16px">说明</h2>
    <p>配置写在鼠标的板载内存里，换电脑也能用，不需要罗技软件常驻。写入前会自动把当前配置备份到备份目录，第一次连接时另存一份原始备份。</p>
    <p>不要同时开 G HUB / LGS，它们会把鼠标切到主机模式，板载配置就不生效了。</p>
  </aside>
</main>
<script>
const G502_NAMES = [
  ['左键', ''], ['右键', ''], ['滚轮按下', ''], ['侧键 后', 'G4'], ['侧键 前', 'G5'],
  ['拇指狙击键', 'G6'], ['左键旁 后', 'G7'], ['左键旁 前', 'G8'], ['滚轮后方', 'G9'],
  ['滚轮右拨', ''], ['滚轮左拨', ''],
];
const ACTIONS = [
  ['m:1', '左键'], ['m:2', '右键'], ['m:4', '中键'], ['m:8', '后退'], ['m:16', '前进'],
  ['s:3', 'DPI +'], ['s:4', 'DPI −'], ['s:5', 'DPI 循环'], ['s:6', '默认 DPI'], ['s:7', '狙击 DPI（按住）'],
  ['s:10', '配置循环'], ['s:8', '下一配置'], ['s:9', '上一配置'], ['s:11', 'G-Shift'],
  ['s:1', '滚轮左拨'], ['s:2', '滚轮右拨'],
  ['key', '键盘按键…'], ['m:0', '无（禁用）'],
];
const KEYS = [];
for (let i = 13; i <= 24; i++) KEYS.push([0x68 + i - 13, 'F' + i]);
for (let i = 1; i <= 12; i++) KEYS.push([0x3a + i - 1, 'F' + i]);
for (let i = 0; i < 26; i++) KEYS.push([0x04 + i, String.fromCharCode(65 + i)]);
'1234567890'.split('').forEach((c, i) => KEYS.push([0x1e + i, c]));
[[0x28,'Enter'],[0x29,'Esc'],[0x2a,'Backspace'],[0x2b,'Tab'],[0x2c,'Space'],[0x2d,'-'],[0x2e,'='],
 [0x2f,'['],[0x30,']'],[0x31,'\\'],[0x33,';'],[0x34,"'"],[0x35,'`'],[0x36,','],[0x37,'.'],[0x38,'/'],
 [0x39,'CapsLock'],[0x46,'PrintScreen'],[0x47,'ScrollLock'],[0x48,'Pause'],[0x49,'Insert'],[0x4a,'Home'],
 [0x4b,'PgUp'],[0x4c,'Delete'],[0x4d,'End'],[0x4e,'PgDn'],[0x4f,'Right'],[0x50,'Left'],[0x51,'Down'],
 [0x52,'Up'],[0x65,'AppsKey'],[0x7f,'Volume_Mute'],[0x80,'Volume_Up'],[0x81,'Volume_Down']].forEach(k => KEYS.push(k));
const KEYNAME = Object.fromEntries(KEYS.map(([c, n]) => [c, n]));
const MODS = [[1, 'Ctrl', '^'], [2, 'Shift', '+'], [4, 'Alt', '!'], [8, 'Win', '#']];

let dev = null, sel = 0, edits = [];   // edits[profileIdx][btn] = hex
const $ = id => document.getElementById(id);

function decode(h) {
  const b = h.match(/../g).map(x => parseInt(x, 16));
  if (b[0] === 0x80 && b[1] === 1) return { act: 'm:' + ((b[2] << 8) | b[3]) };
  if (b[0] === 0x80 && b[1] === 2) return { act: 'key', mod: b[2], key: b[3] };
  if (b[0] === 0x90) return { act: 's:' + b[1] };
  return { act: 'raw', raw: h };
}
const hx = n => n.toString(16).padStart(2, '0');
function encode(d) {
  if (d.act === 'raw') return d.raw;
  if (d.act === 'key') return '8002' + hx(d.mod) + hx(d.key);
  const [t, v] = d.act.split(':'); const n = +v;
  if (t === 'm') return '8001' + hx(n >> 8) + hx(n & 255);
  return '90' + hx(n) + 'ffff';
}
function names(i) {
  if (dev && dev.buttonCount === 11) return G502_NAMES[i];
  return ['按键 ' + (i + 1), ''];
}
function status(msg, cls = '') { const s = $('status'); s.textContent = msg; s.className = cls; }

function render() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  if (!dev || !dev.profiles) { $('rows').innerHTML = ''; renderAHK(); return; }
  dev.profiles.forEach((p, i) => {
    const t = document.createElement('button');
    t.className = 'tab' + (i === sel ? ' on' : '');
    t.innerHTML = '配置 ' + (i + 1) + (p.sector === dev.current ? '<span class="cur">● 当前</span>' : '');
    t.onclick = () => { sel = i; render(); };
    tabs.appendChild(t);
  });
  const p = dev.profiles[sel], rows = $('rows'); rows.innerHTML = '';
  edits[sel].forEach((h, i) => {
    const d = decode(h), tr = document.createElement('tr');
    if (h !== p.buttons[i]) tr.className = 'changed';
    const [nm, g] = names(i);
    const td1 = document.createElement('td'); td1.className = 'name';
    td1.innerHTML = nm + (g ? ' <b>' + g + '</b>' : '') + '<small>默认：' + label(dev.profiles[sel].buttons[i]) + '</small>';
    const td2 = document.createElement('td');
    const s = document.createElement('select');
    const opts = ACTIONS.slice();
    if (d.act === 'raw') opts.unshift(['raw', '保持原样']);
    opts.forEach(([v, t]) => { const o = new Option(t, v); s.add(o); });
    s.value = d.act;
    s.onchange = () => {
      let nd = { act: s.value };
      if (s.value === 'key') nd = { act: 'key', mod: 0, key: 0x68 };
      if (s.value === 'raw') nd = { act: 'raw', raw: p.buttons[i] };
      edits[sel][i] = encode(nd); render();
    };
    td2.appendChild(s);
    if (d.act === 'key') {
      const kc = document.createElement('span'); kc.className = 'keycfg';
      MODS.forEach(([bit, n]) => {
        const l = document.createElement('label'), c = document.createElement('input');
        c.type = 'checkbox'; c.checked = !!(d.mod & bit);
        c.onchange = () => { d.mod ^= bit; edits[sel][i] = encode(d); render(); };
        l.append(c, n); kc.appendChild(l);
      });
      const ks = document.createElement('select');
      if (!KEYNAME[d.key]) ks.add(new Option('0x' + hx(d.key), d.key));
      KEYS.forEach(([c, n]) => ks.add(new Option(n, c)));
      ks.value = d.key;
      ks.onchange = () => { d.key = +ks.value; edits[sel][i] = encode(d); render(); };
      kc.appendChild(ks); td2.appendChild(kc);
    }
    if (d.act === 'raw') { const r = document.createElement('span'); r.className = 'raw'; r.textContent = h; td2.appendChild(r); }
    tr.append(td1, td2); rows.appendChild(tr);
  });
  const dirty = edits[sel].some((h, i) => h !== p.buttons[i]);
  $('bWrite').disabled = !dirty; $('bUndo').disabled = !dirty;
  renderAHK();
}
function label(h) {
  const d = decode(h);
  if (d.act === 'key') return keyLabel(d);
  if (d.act === 'raw') return h;
  const a = ACTIONS.find(x => x[0] === d.act); return a ? a[1] : h;
}
function keyLabel(d) {
  return MODS.filter(m => d.mod & m[0]).map(m => m[1] + '+').join('') + (KEYNAME[d.key] || '0x' + hx(d.key));
}
function renderAHK() {
  const lines = ['#Requires AutoHotkey v2.0', ''];
  if (dev && dev.profiles) {
    edits[sel].forEach((h, i) => {
      const d = decode(h); if (d.act !== 'key') return;
      const pre = MODS.filter(m => d.mod & m[0]).map(m => m[2]).join('');
      const k = KEYNAME[d.key] || ('sc' + hx(d.key));
      const [nm, g] = names(i);
      lines.push(`${pre}${k}:: {      ; ${g || nm}`, '    ; 在这里写动作，例如 Send "^c"', '}', '');
    });
  }
  if (lines.length === 2) lines.push('; 当前配置里没有映射成键盘按键的键');
  $('ahk').textContent = lines.join('\n');
}

async function connect() {
  status('读取中…');
  try {
    dev = await goConnect();
    $('dev').textContent = `${dev.name || 'Logitech'}  ·  PID ${dev.pid}  ·  ${dev.mode === 1 ? '板载模式' : '主机模式（软件控制）'}`;
    if (!dev.profiles) { edits = []; sel = 0; render(); status(dev.note || '没有用户配置', 'warn'); setBtns(true); $('bWrite').disabled = true; return; }
    if (sel >= dev.profiles.length) sel = 0;
    const ci = dev.profiles.findIndex(p => p.sector === dev.current); if (ci >= 0 && edits.length === 0) sel = ci;
    edits = dev.profiles.map(p => p.buttons.slice());
    setBtns(true); render();
    const bad = dev.profiles.filter(p => !p.crcOk).map(p => p.sector);
    status((dev.note ? dev.note + '\n' : '') + (bad.length ? '注意：扇区 ' + bad.join(',') + ' CRC 不对\n' : '') +
      (dev.mode !== 1 ? '鼠标当前是主机模式，写入后会自动切回板载模式。' : '已读取。'), bad.length || dev.mode !== 1 ? 'warn' : 'ok');
  } catch (e) { dev = null; setBtns(false); render(); status(String(e), 'err'); }
}
function setBtns(on) { ['bF1314', 'bRestore', 'bFactory'].forEach(id => $(id).disabled = !on); }

$('bConnect').onclick = connect;
$('bUndo').onclick = () => { edits[sel] = dev.profiles[sel].buttons.slice(); render(); };
$('bF1314').onclick = () => {
  if (!dev || dev.buttonCount !== 11) { status('不是 G502 布局，请手动设置', 'warn'); return; }
  edits[sel][6] = encode({ act: 'key', mod: 0, key: 0x68 });
  edits[sel][7] = encode({ act: 'key', mod: 0, key: 0x69 });
  render(); status('已设置 G7=F13、G8=F14，点「写入鼠标」生效。');
};
$('bWrite').onclick = async () => {
  const e = edits[sel];
  if (decode(e[0]).act !== 'm:1' && !confirm('左键不再是「左键」，写入后可能没法用鼠标点击。确定吗？')) return;
  if (!e.some(h => h === '80010001') && !confirm('这个配置里没有任何键是左键，确定吗？')) return;
  status('写入中…'); $('bWrite').disabled = true;
  try { await goWrite(dev.profiles[sel].sector, e); await connect(); status('写入成功，已生效。', 'ok'); }
  catch (err) { status('写入失败：' + err, 'err'); render(); }
};
$('bFactory').onclick = async () => {
  if (!confirm('用鼠标 ROM 里的出厂设置覆盖全部配置？（会先自动备份）')) return;
  status('恢复中…');
  try { await goFactory(); edits = []; await connect(); status('已恢复出厂配置。', 'ok'); } catch (e) { status(String(e), 'err'); }
};
$('bRestore').onclick = async () => {
  if (!confirm('把全部配置恢复成第一次连接时备份的原始状态？')) return;
  status('恢复中…');
  try { await goRestore(); edits = []; await connect(); status('已恢复原始备份。', 'ok'); } catch (e) { status(String(e), 'err'); }
};
$('bDir').onclick = () => goOpenDir();
$('bCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('ahk').textContent); status('已复制 AHK 模板。', 'ok'); }
  catch { const r = document.createRange(); r.selectNodeContents($('ahk')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); status('已复制 AHK 模板。', 'ok'); }
};
connect();
</script>
</body>
</html>
